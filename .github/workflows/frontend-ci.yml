name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
      # npm ci is almost the same command as npm install (https://docs.npmjs.com/cli/v8/commands/npm-ci)
        run: npm ci

      - name: Run tests
      # IMPORTANT! move to correct folder before executing a command
      # In this case, the command should be executed in the frontend folder
        run: npm run test -- --run

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
